<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1520" viewBox="0 0 1600 1520" role="img"><title>RoadToSchool — đề xuất thiết kế trang IoT</title><style>text{font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif}</style><rect x="0" y="0" width="1600" height="1520" rx="0" fill="#FFFDF6" stroke="none" /><rect x="0" y="0" width="1600" height="1520" rx="0" fill="#F3F4F6" stroke="none" /><text x="48" y="51" font-size="28" fill="#17243B" font-weight="700" >RoadToSchool / Thiết bị IoT</text><text x="48" y="81" font-size="15" fill="#64748B" font-weight="400" >Wireframe đề xuất · Hai tab quản lý và panel thiết lập USB</text><text x="48" y="133" font-size="18" fill="#1E293B" font-weight="700" >Trang chính</text><rect x="48" y="154" width="1018" height="555" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><rect x="49" y="155" width="146" height="553" rx="5" fill="#E5E7EB" stroke="none" /><text x="67" y="188" font-size="13" fill="#64748B" font-weight="400" >Sidebar</text><rect x="196" y="155" width="869" height="52" rx="0" fill="#F8FAFC" stroke="none" /><text x="218" y="189" font-size="13" fill="#64748B" font-weight="400" >Header hiện có</text><text x="218" y="244" font-size="20" fill="#1E293B" font-weight="600" >Thiết bị IoT</text><rect x="855" y="218" width="185" height="38" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="871" y="246" font-size="13" fill="#475569" font-weight="600" >Thiết lập qua USB</text><text x="218" y="291" font-size="14" fill="#1E293B" font-weight="700" >Thiết bị</text><text x="355" y="291" font-size="14" fill="#64748B" font-weight="400" >Lịch sử quét thẻ</text><path d="M218 304L1040 304" stroke="#AEB7C2" stroke-width="1"/><rect x="218" y="325" width="822" height="65" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="234" y="353" font-size="13" fill="#475569" font-weight="600" >Bộ lọc / Làm mới theo từng tab</text><rect x="218" y="408" width="822" height="221" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><