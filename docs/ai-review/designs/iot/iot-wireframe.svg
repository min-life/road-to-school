60" height="154" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="64" y="821" font-size="13" fill="#475569" font-weight="600" >Chưa kết nối USB</text><text x="65" y="855" font-size="13" fill="#64748B" font-weight="400" >Một CTA Kết nối USB</text><text x="65" y="886" font-size="13" fill="#64748B" font-weight="400" >Wi-Fi hiển thị điều kiện cần</text><rect x="432" y="793" width="360" height="154" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="448" y="821" font-size="13" fill="#475569" font-weight="600" >Thiết lập thành công</text><text x="449" y="855" font-size="13" fill="#64748B" font-weight="400" >USB / ACK / Wi-Fi độc lập</text><text x="449" y="886" font-size="13" fill="#64748B" font-weight="400" >Máy chủ theo lastSeenAt</text><rect x="816" y="793" width="360" height="154" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="832" y="821" font-size="13" fill="#475569" font-weight="600" >Lỗi cấp cấu hình</text><text x="833" y="855" font-size="13" fill="#64748B" font-weight="400" >Giữ chip/MAC đã xác minh</text><text x="833" y="886" font-size="13" fill="#64748B" font-weight="400" >Thông báo ngay tại bước lỗi</text><rect x="1200" y="793" width="360" height="154" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="1216" y="821" font-size="13" fill="#475569" font-weight="600" >Nạp firmware</text><text x="1217" y="855" font-size="13" fill="#64748B" font-weight="400" >Xác nhận đúng thiết bị</text><text x="1217" y="886" font-size="13" fill="#64748B" font-weight="400" >Tiến độ → khởi động → INFO</text><text x="48" y="1007" font-size="18" fill="#1E293B" font-weight="700" >Lịch sử quét</text><rect x="48" y="1030" width="1054" height="365" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="70" y="1071" font-size="13" fill="#1E293B" font-weight="400" >Thiết bị [dropdown tìm mã]   Xe [dropdown]   Lọc   Xóa bộ lọc</text><text x="70" y="1105" font-size="13" fill="#64748B" font-weight="400" >Tự cập nhật [switch]       Trạng thái luồng Web       Làm mới</text><path d="M70 1123L1078 1123" stroke="#E2E8F0" stroke-width="1"/><text x="70" y="1154" font-size="13" fill="#1E293B" font-weight="600" >Thời gian quét       Xe lúc quét       Mã thẻ (UID)       Loại thẻ       Thiết bị</text><path d="M70 1172L1078 1172" stroke="#E2E8F0" stroke-width="1"/><text x="85" y="1200" font-size="12" fill="#64748B" font-weight="400" >HH:mm:ss / DD/MM/YYYY      Biển số lịch sử      UID      Loại thẻ      Mã thiết bị</text><path d="M70 1220L1078 1220" stroke="#E2E8F0" stroke-width="1"/><text x="85" y="1248" font-size="12" fill="#64748B" font-weight="400" >HH:mm:ss / DD/MM/YYYY      Biển số lịch sử      UID      Loại thẻ      Mã thiết bị</text><path d="M70 1268L1078 1268" stroke="#E2E8F0" stroke-width="1"/><text x="85" y="1296" font-size="12" fill="#64748B" font-weight="400" >HH:mm:ss / DD/MM/YYYY      Biển số lịch sử      UID      Loại thẻ      Mã thiết bị</text><text x="70" y="1371" font-size="12" fill="#64748B" font-weight="400" >Phân trang 20 dòng · Giữ bộ lọc khi làm mới</text><text x="1138" y="1071" font-size="16" fill="#1E293B" font-weight="650" >Bố cục hẹp</text><rect x="1138" y="1093" width="414" height="302" rx="6" fill="#FFFFFF" stroke="#AEB7C2" /><text x="1160" y="1133" font-size="13" fill="#64748B" font-weight="400" >Tabs và CTA xuống hàng</text><text x="1160" y="1178" font-size="13" fill="#64748B" font-weight="400" >Panel USB theo chiều rộng màn hình</text><text x="1160" y="1223" font-size="13" fill="#64748B" font-weight="400" >Bộ lọc xếp dọc</text><text x="1160" y="1268" font-size="13" fill="#64748B" font-weight="400" >Bảng cuộn ngang trong vùng riêng</text><text x="1160" y="1313" font-size="13" fill="#64748B" font-weight="400" >Header/footer form cố định</text><text x="1160" y="1358" font-size="13" fill="#64748B" font-weight="400" >Nội dung form cuộn dọc</text><text x="48" y="1474" font-size="13" fill="#64748B" font-weight="400" >Bản cấu trúc để duyệt thiết kế · Chưa triển khai lên ứng dụng</text></svg>